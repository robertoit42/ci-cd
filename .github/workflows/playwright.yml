name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      env:
        HOME: /root   # 👈 esto fuerza a Firefox a usar /root como HOME
    steps:
      - uses: actions/checkout@v4
      # Actualiza npm dentro del contenedor para soportar lockfileVersion 3.
      - name: Update npm
        run: npm install -g npm@9
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: lts/*
       # Instala Node.js 20 dentro del contenedor
      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      
      - name: Install dependencies
        run: npm ci
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
